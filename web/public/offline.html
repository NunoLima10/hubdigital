<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Sem ligação · Hub Digital</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: light dark; --bg: #fff; --fg: #0a0a0a; --muted: #737373; }
      @media (prefers-color-scheme: dark) { :root { --bg: #171717; --fg: #fafafa; --muted: #a3a3a3; } }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
        background: var(--bg); color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center;
      }
      main { max-width: 360px; }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { font-size: 1.375rem; margin: 20px 0 8px; }
      p { color: var(--muted); line-height: 1.5; margin: 0 0 24px; }
      button {
        font: inherit; font-weight: 600; cursor: pointer; border: 0; border-radius: 10px;
        padding: 10px 20px; background: var(--fg); color: var(--bg);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Hub Digital" />
      <h1>Estás sem ligação</h1>
      <p>Não conseguimos carregar esta página. Verifica a tua ligação à internet e tenta outra vez.</p>
      <button type="button" onclick="location.reload()">Tentar outra vez</button>
    </main>
    <script>
      addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
